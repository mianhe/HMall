name: HMall CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      services: ${{ steps.filter.outputs.services }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'pom.xml'
            services:
              - 'services/catalog-service/**'
              - 'services/user-service/**'
              - 'services/order-service/**'
              - 'services/inventory-service/**'
              - 'services/payment-service/**'
              - 'services/activity-service/**'
              - 'services/cart-service/**'
              - 'services/fulfillment-service/**'
              - 'services/smart-interaction-service/**'
              - 'services/bff-web/**'
            frontend:
              - 'frontend/**'

  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { dir: catalog-service, name: Catalog }
          - { dir: user-service, name: User }
          - { dir: order-service, name: Order }
          - { dir: inventory-service, name: Inventory }
          - { dir: payment-service, name: Payment }
          - { dir: activity-service, name: Activity }
          - { dir: cart-service, name: Cart }
          - { dir: fulfillment-service, name: Fulfillment }
          - { dir: smart-interaction-service, name: SmartInteraction }
          - { dir: bff-web, name: BFF }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test ${{ matrix.service.name }}
        working-directory: services/${{ matrix.service.dir }}
        run: mvn test -B -q

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service.dir }}
          path: services/${{ matrix.service.dir }}/target/surefire-reports/
          retention-days: 7

  frontend-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { dir: frontend/web, name: Web }
          - { dir: frontend/admin, name: Admin, build-args: '--base=/admin/' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app.dir }}/package-lock.json

      - name: Install & Build ${{ matrix.app.name }}
        working-directory: ${{ matrix.app.dir }}
        run: |
          npm ci
          if [ -n "${{ matrix.app.build-args }}" ]; then
            npx vite build ${{ matrix.app.build-args }}
          else
            npm run build
          fi

  ci-result:
    if: always()
    needs: [ backend-test, frontend-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-test.result }}" = "failure" ] || [ "${{ needs.frontend-build.result }}" = "failure" ]; then
            echo "::error::CI failed. Check individual job results above."
            exit 1
          fi
          echo "All checks passed."
