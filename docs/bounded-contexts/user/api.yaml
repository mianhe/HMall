openapi: 3.0.3
info:
  title: 用户限定上下文 API
  description: 用户管理的 REST 契约。Step Definitions 与实现均按此规范。
  version: 0.1.0

paths:
  /api/users:
    post:
      summary: 创建用户
      description: 创建新用户，username 必填且全局唯一，password 必填。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 业务校验失败（用户名已存在、用户名为空、密码为空等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: 查询用户列表
      description: 返回所有用户列表（不含 passwordHash）。
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/users/{userId}/addresses:
    get:
      summary: 按 userId 查地址列表
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 地址列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      summary: 新增收货地址
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 业务校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{userId}/addresses/{addressId}:
    get:
      summary: 按 addressId 查地址详情
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 地址详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          description: 地址不存在或不属于该用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: 修改收货地址
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 业务校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 地址不存在或不属于该用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 删除收货地址
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '404':
          description: 地址不存在或不属于该用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}:
    get:
      summary: 按 ID 查用户详情
      description: 返回用户信息，不含 passwordHash。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/login:
    post:
      summary: 用户登录
      description: 用户名密码正确时返回 JWT token；用户不存在或密码错误返回 401；用户名为空或密码为空返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 业务校验失败（用户名为空、密码为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 认证失败（用户不存在、密码错误）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT token
    AddressCreate:
      type: object
      required: [recipientName, phone, province, city, district, detail]
      properties:
        recipientName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
    AddressUpdate:
      type: object
      required: [recipientName, phone, province, city, district, detail]
      properties:
        recipientName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
    Address:
      type: object
      required: [addressId, userId, recipientName, phone, province, city, district, detail]
      properties:
        addressId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        recipientName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: 错误信息
