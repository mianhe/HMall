openapi: 3.0.3
info:
  title: Promotion Service API
  version: 0.2.0
  description: 优惠券 + 促销活动 + 统一价格引擎 API（迭代 0–2）

paths:
  /api/promotion/health:
    get:
      summary: 健康检查
      operationId: health
      responses:
        '200':
          description: 服务就绪

  /api/promotion/coupon-templates:
    get:
      summary: 查询券模板列表
      operationId: listCouponTemplates
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplatePage'

    post:
      summary: 创建券模板
      operationId: createCouponTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponTemplateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplateDto'
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'

  /api/promotion/coupon-templates/{id}:
    get:
      summary: 查询单个券模板
      operationId: getCouponTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 模板详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplateDto'
        '404':
          description: 模板不存在

  /api/promotion/coupon-templates/{id}/deactivate:
    post:
      summary: 停用券模板
      operationId: deactivateCouponTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 停用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplateDto'
        '404':
          description: 模板不存在

  /api/promotion/coupon-templates/{id}/issue:
    post:
      summary: 管理员向用户发放优惠券
      operationId: issueCoupons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCouponRequest'
      responses:
        '200':
          description: 发放成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponDto'
        '400':
          description: 模板已停用/库存不足/超过限领
        '404':
          description: 模板不存在

  /api/promotion/coupon-templates/{id}/claim:
    post:
      summary: 用户领取优惠券
      operationId: claimCoupon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 领取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDto'
        '400':
          description: 模板已停用/库存不足/超过限领

  /api/promotion/coupon-templates/claimable:
    get:
      summary: 查询可领券模板列表
      operationId: listClaimableTemplates
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 可领模板列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponTemplateDto'

  /api/promotion/coupons/my:
    get:
      summary: 查询用户的优惠券列表
      operationId: myCoupons
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CouponStatus'
      responses:
        '200':
          description: 优惠券列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponDto'

  /api/promotion/coupons/expire-scan:
    post:
      summary: 执行过期扫描
      operationId: expireScan
      responses:
        '200':
          description: 扫描完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiredCount:
                    type: integer

  /api/promotion/activities:
    get:
      summary: 查询促销活动列表
      operationId: listPromotionActivities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 活动分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionActivityPage'
    post:
      summary: 创建促销活动
      operationId: createPromotionActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionActivityRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionActivityDto'
        '400':
          description: 参数校验失败

  /api/promotion/activities/{id}/activate:
    post:
      summary: 上线促销活动
      operationId: activatePromotionActivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 上线成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionActivityDto'

  /api/promotion/activities/{id}/deactivate:
    post:
      summary: 下线促销活动
      operationId: deactivatePromotionActivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 下线成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionActivityDto'

  /api/promotion/calculate-price:
    post:
      summary: 统一算价（活动 + 优惠券）
      operationId: calculatePrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculatePriceRequest'
      responses:
        '200':
          description: 算价成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculatePriceResponse'
        '400':
          description: 参数错误或券不可用

  /api/promotion/preview-sku-prices:
    post:
      summary: 批量预估 SKU 活动价
      operationId: previewSkuPrices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewSkuPricesRequest'
      responses:
        '200':
          description: 预估结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewSkuPriceResponse'

components:
  schemas:
    ErrorDto:
      type: object
      properties:
        message:
          type: string

    CouponType:
      type: string
      enum: [AMOUNT_OFF, PERCENTAGE_OFF]

    TemplateStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    CreateCouponTemplateRequest:
      type: object
      required: [name, type, thresholdCents, totalQuantity, perUserLimit, validDays]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/CouponType'
        thresholdCents:
          type: integer
          format: int64
        discountCents:
          type: integer
          format: int64
        discountRate:
          type: number
          format: double
        maxDiscountCents:
          type: integer
          format: int64
        totalQuantity:
          type: integer
        perUserLimit:
          type: integer
        validDays:
          type: integer
        targetingRule:
          $ref: '#/components/schemas/TargetingRule'

    CouponTemplateDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/CouponType'
        thresholdCents:
          type: integer
          format: int64
        discountCents:
          type: integer
          format: int64
        discountRate:
          type: number
          format: double
        maxDiscountCents:
          type: integer
          format: int64
        totalQuantity:
          type: integer
        issuedQuantity:
          type: integer
        perUserLimit:
          type: integer
        validDays:
          type: integer
        targetingRule:
          $ref: '#/components/schemas/TargetingRule'
        status:
          $ref: '#/components/schemas/TemplateStatus'
        createdAt:
          type: string
          format: date-time

    CouponStatus:
      type: string
      enum: [AVAILABLE, LOCKED, USED, EXPIRED]

    IssueCouponRequest:
      type: object
      required: [userId, quantity]
      properties:
        userId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    CouponDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/CouponType'
        thresholdCents:
          type: integer
          format: int64
        discountCents:
          type: integer
          format: int64
        discountRate:
          type: number
          format: double
        maxDiscountCents:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/CouponStatus'
        orderId:
          type: integer
          format: int64
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time

    CouponTemplatePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CouponTemplateDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    PromotionActivityType:
      type: string
      enum: [SKU_AMOUNT_OFF, ORDER_AMOUNT_OFF]

    PromotionActivityStatus:
      type: string
      enum: [DRAFT, ACTIVE, INACTIVE]

    CreatePromotionActivityRequest:
      type: object
      required: [name, type, discountCents, startAt, endAt]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/PromotionActivityType'
        targetSkuIds:
          type: array
          items:
            type: integer
            format: int64
        thresholdCents:
          type: integer
          format: int64
        discountCents:
          type: integer
          format: int64
        mutexGroupCode:
          type: string
        priority:
          type: integer
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        targetingRule:
          $ref: '#/components/schemas/TargetingRule'
        pieceRule:
          $ref: '#/components/schemas/PieceRule'

    PromotionActivityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/PromotionActivityType'
        targetSkuIds:
          type: array
          items:
            type: integer
            format: int64
        thresholdCents:
          type: integer
          format: int64
        discountCents:
          type: integer
          format: int64
        mutexGroupCode:
          type: string
        priority:
          type: integer
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        targetingRule:
          $ref: '#/components/schemas/TargetingRule'
        pieceRule:
          $ref: '#/components/schemas/PieceRule'
        status:
          $ref: '#/components/schemas/PromotionActivityStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PromotionActivityPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PromotionActivityDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    PreviewSkuPricesRequest:
      type: object
      required: [items]
      properties:
        userId:
          type: integer
          format: int64
        items:
          type: array
          items:
            type: object
            required: [skuId, unitPriceCents]
            properties:
              skuId:
                type: integer
                format: int64
              unitPriceCents:
                type: integer
                format: int64

    PreviewSkuPriceResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              skuId:
                type: integer
                format: int64
              originalPriceCents:
                type: integer
                format: int64
              activityDiscountCents:
                type: integer
                format: int64
              activityPriceCents:
                type: integer
                format: int64
              activityLabel:
                type: string
              ineligibleReason:
                type: string

    TargetingRule:
      type: object
      properties:
        levelsIn:
          type: array
          items:
            type: string
        tagsAny:
          type: array
          items:
            type: string
        tagsAll:
          type: array
          items:
            type: string
        excludeTags:
          type: array
          items:
            type: string

    PieceRule:
      type: object
      properties:
        scopeType:
          type: string
          enum: [ORDER, SKU]
        scopeIds:
          type: array
          items:
            type: integer
            format: int64
        minQuantity:
          type: integer
        discountType:
          type: string
          enum: [AMOUNT_OFF, PERCENTAGE_OFF]
        discountValue:
          type: integer
          format: int64
        maxDiscountCents:
          type: integer
          format: int64

    CalculatePriceRequest:
      type: object
      required: [items, userId]
      properties:
        userId:
          type: integer
          format: int64
        couponId:
          type: integer
          format: int64
        items:
          type: array
          items:
            type: object
            required: [skuId, unitPriceCents, quantity]
            properties:
              skuId:
                type: integer
                format: int64
              unitPriceCents:
                type: integer
                format: int64
              quantity:
                type: integer

    CalculatePriceResponse:
      type: object
      properties:
        originalAmountCents:
          type: integer
          format: int64
        activityDiscountAmountCents:
          type: integer
          format: int64
        couponDiscountAmountCents:
          type: integer
          format: int64
        discountAmountCents:
          type: integer
          format: int64
        payableAmountCents:
          type: integer
          format: int64
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/PriceLineItem'
        activityExplanations:
          type: array
          items:
            $ref: '#/components/schemas/ActivityExplanation'

    PriceLineItem:
      type: object
      properties:
        skuId:
          type: integer
          format: int64
        unitPriceCents:
          type: integer
          format: int64
        quantity:
          type: integer
        totalPriceCents:
          type: integer
          format: int64
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/DiscountDetail'

    DiscountDetail:
      type: object
      properties:
        type:
          type: string
        sourceId:
          type: integer
          format: int64
        amountCents:
          type: integer
          format: int64
        description:
          type: string

    ActivityExplanation:
      type: object
      properties:
        activityId:
          type: integer
          format: int64
        activityName:
          type: string
        applied:
          type: boolean
        message:
          type: string
