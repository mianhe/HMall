openapi: 3.0.3
info:
  title: Activity 限界上下文 API
  description: 业务活动查询与统计的 REST 契约。
  version: 0.1.0

paths:
  /api/activities:
    get:
      summary: 按条件查询业务活动
      description: 支持按 orderId、userId、skuId、spuId 任一或组合查询；参数为 AND 关系。来自智能运营 Step 1 的多维查询能力。
      parameters:
        - name: orderId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: userId
          in: query
          required: false
          description: 按用户维度查询
          schema:
            type: integer
            format: int64
        - name: skuId
          in: query
          required: false
          description: 按 SKU 维度查询（correlationKeys 含该 skuId）
          schema:
            type: integer
            format: int64
        - name: spuId
          in: query
          required: false
          description: 按 SPU 维度查询（correlationKeys 含该 spuId）
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityDto'

  /api/activities/recent:
    get:
      summary: 查询最近业务活动
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityDto'

  /api/activities/event-metadata:
    get:
      summary: 查询所有已注册的事件元数据
      description: 返回系统中所有已知事件类型的业务语义信息，包括所属 BC、中文标签、分类（正向/补偿/异常）及补偿关系。前端应使用此接口获取事件展示信息，而非硬编码。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventMetadataDto'

  /api/activities/stats:
    get:
      summary: 查询统计（支持时间范围，用于仪表盘）
      description: 可选传入 userId、spuId 做维度筛选（Step 1 仅预留参数，筛选逻辑可延至 Step 2）。
      parameters:
        - name: userId
          in: query
          required: false
          description: 按用户维度筛选统计（预留）
          schema:
            type: integer
            format: int64
        - name: spuId
          in: query
          required: false
          description: 按 SPU 维度筛选统计（预留）
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          description: 起始日期（含），ISO 本地日期 YYYY-MM-DD；与 to 同时传入时按区间统计
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 结束日期（含），ISO 本地日期 YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: period
          in: query
          required: false
          description: 快捷周期，与 from/to 二选一。today=今日，last7=最近7天，last30=最近30天
          schema:
            type: string
            enum: [today, last7, last30]
            default: today
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsDto'

components:
  schemas:
    ActivityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: string
          description: 事件实例的 UUID，由发布方生成；唯一，用于幂等
        eventType:
          type: string
        topic:
          type: string
        orderId:
          type: integer
          format: int64
          nullable: true
          description: 关联订单 ID；与订单无关的事件为 null
        userId:
          type: integer
          format: int64
          nullable: true
          description: 关联用户 ID；从事件 payload 提取，无则 null（智能运营 Step 1）
        payload:
          type: string
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/EventMetadataDto'
          nullable: true
          description: 事件元数据（所属 BC、中文标签、分类等）；未注册的事件类型为 null

    EventMetadataDto:
      type: object
      description: 事件类型的业务语义元数据。由后端 EventMetadataRegistry 集中管理，前端直接使用，不应硬编码。
      properties:
        eventType:
          type: string
          description: 事件类型标识，如 OrderCreated
        boundedContext:
          type: string
          description: 所属限界上下文，如 Order、Payment、Inventory、Fulfillment
        label:
          type: string
          description: 中文显示标签，如"订单创建"、"库存锁定"
        category:
          type: string
          enum: [normal, compensation, exception]
          description: 事件分类：normal=正向事件，compensation=补偿事件，exception=异常事件
        compensatesEventType:
          type: string
          nullable: true
          description: 仅补偿事件有值，表示它补偿的正向事件类型（如 StockReleased 补偿 StockReserved）
        origin:
          type: string
          enum: [domain, behavioral, derived]
          description: 事件来源类型（智能运营 Step 1）
        processRoles:
          type: object
          additionalProperties:
            type: string
          description: 事件在各一级流程中的角色，key=流程标识，value=MILESTONE 或 PROGRESSION

    StatsDto:
      type: object
      description: 统计周期内由事件聚合的指标，用于仪表盘展示。时间范围由查询参数 from/to 或 period 决定。
      properties:
        # 订单概览（Order 事件）
        ordersCreated:
          type: integer
          description: 已开出订单总数（OrderCreated）
        ordersCancelled:
          type: integer
          description: 已取消订单数（OrderCancelled）
        ordersCompleted:
          type: integer
          description: 已完成订单数（OrderCompleted）
        # 支付概览（Payment 事件）
        paymentAttempts:
          type: integer
          description: 支付尝试总数（成功+失败+过期）
        paymentSuccess:
          type: integer
          description: 成功支付数（PaymentCompleted）
        paymentFailed:
          type: integer
          description: 支付失败数（PaymentFailed）
        paymentExpired:
          type: integer
          description: 支付过期数（PaymentExpired）
        paymentTotalCents:
          type: integer
          format: int64
          description: 成功支付总金额（分）
        # 库存活动（Inventory 事件，可选）
        stockReserved:
          type: integer
          description: 库存占用次数（StockReserved）
        stockReleased:
          type: integer
          description: 库存释放次数（StockReleased）
        # 履约概览（Fulfillment 事件）
        fulfillmentCreated:
          type: integer
          description: 履约单创建数（FulfillmentOrderCreated）
        fulfillmentAllocated:
          type: integer
          description: 开始配货数（FulfillmentOrderAllocated）
        fulfillmentShipped:
          type: integer
          description: 已发货数（FulfillmentShipped）
        fulfillmentDelivered:
          type: integer
          description: 已签收数（FulfillmentDelivered）
        # 元数据
        from:
          type: string
          format: date
          description: 统计起始日期（响应中回显）
        to:
          type: string
          format: date
          description: 统计结束日期（响应中回显）

    Error:
      type: object
      properties:
        message:
          type: string
