openapi: 3.0.3
info:
  title: Activity 限界上下文 API
  description: 业务活动查询与统计的 REST 契约。
  version: 0.1.0

paths:
  /api/activities:
    get:
      summary: 按条件查询业务活动
      parameters:
        - name: orderId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityDto'

  /api/activities/recent:
    get:
      summary: 查询最近业务活动
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityDto'

  /api/activities/stats:
    get:
      summary: 查询统计（支持时间范围，用于仪表盘）
      parameters:
        - name: from
          in: query
          required: false
          description: 起始日期（含），ISO 本地日期 YYYY-MM-DD；与 to 同时传入时按区间统计
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 结束日期（含），ISO 本地日期 YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: period
          in: query
          required: false
          description: 快捷周期，与 from/to 二选一。today=今日，last7=最近7天，last30=最近30天
          schema:
            type: string
            enum: [today, last7, last30]
            default: today
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsDto'

components:
  schemas:
    ActivityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: string
          description: 事件实例的 UUID，由发布方生成；唯一，用于幂等
        eventType:
          type: string
        topic:
          type: string
        orderId:
          type: integer
          format: int64
          nullable: true
          description: 关联订单 ID；与订单无关的事件为 null
        payload:
          type: string
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time

    StatsDto:
      type: object
      description: 统计周期内由事件聚合的指标，用于仪表盘展示。时间范围由查询参数 from/to 或 period 决定。
      properties:
        # 订单概览（Order 事件）
        ordersCreated:
          type: integer
          description: 已开出订单总数（OrderCreated）
        ordersCancelled:
          type: integer
          description: 已取消订单数（OrderCancelled）
        ordersCompleted:
          type: integer
          description: 已完成订单数（OrderCompleted）
        # 支付概览（Payment 事件）
        paymentAttempts:
          type: integer
          description: 支付尝试总数（成功+失败+过期）
        paymentSuccess:
          type: integer
          description: 成功支付数（PaymentCompleted）
        paymentFailed:
          type: integer
          description: 支付失败数（PaymentFailed）
        paymentExpired:
          type: integer
          description: 支付过期数（PaymentExpired）
        # 库存活动（Inventory 事件，可选）
        stockReserved:
          type: integer
          description: 库存占用次数（StockReserved）
        stockReleased:
          type: integer
          description: 库存释放次数（StockReleased）
        # 元数据
        from:
          type: string
          format: date
          description: 统计起始日期（响应中回显）
        to:
          type: string
          format: date
          description: 统计结束日期（响应中回显）

    Error:
      type: object
      properties:
        message:
          type: string
