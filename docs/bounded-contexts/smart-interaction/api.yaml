openapi: 3.0.3
info:
  title: Smart Interaction Service API
  description: HMall 智能交互服务 API — Skill 管理
  version: 0.2.0

servers:
  - url: http://localhost:8089
    description: 本地开发

paths:
  /api/ai/skills:
    get:
      summary: 查询 Skill 列表
      operationId: listSkills
      responses:
        '200':
          description: Skill 列表（按 createdAt 降序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillDto'

    post:
      summary: 创建 Skill
      operationId: createSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '400':
          description: 参数校验失败（如名称为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ai/skills/{skillId}:
    get:
      summary: 查询 Skill 详情
      operationId: getSkill
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Skill 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '404':
          description: Skill 不存在

    put:
      summary: 更新 Skill
      operationId: updateSkill
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '404':
          description: Skill 不存在

    delete:
      summary: 删除 Skill
      operationId: deleteSkill
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '404':
          description: Skill 不存在

  /api/ai/skills/{skillId}/default:
    put:
      summary: 将 Skill 设为默认
      operationId: setDefaultSkill
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDto'
        '404':
          description: Skill 不存在

components:
  schemas:
    SkillDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
        allowedTools:
          type: array
          items:
            type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSkillRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
        allowedTools:
          type: array
          items:
            type: string

    UpdateSkillRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
        allowedTools:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
