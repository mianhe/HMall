# 启动：在项目根目录执行  docker compose -f infra/docker-compose.yml up -d
# 停止：docker compose -f infra/docker-compose.yml down
# Kafka：供 Inventory 等发布领域事件，端口 9092；其他应用可订阅 inventory.stock.* 等 topic

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: hmall-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: hmall-postgres
    environment:
      POSTGRES_DB: hmall
      POSTGRES_USER: hmall
      POSTGRES_PASSWORD: hmall_dev
    ports:
      - "5432:5432"
    volumes:
      - hmall_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: hmall-minio
    environment:
      MINIO_ROOT_USER: hmall
      MINIO_ROOT_PASSWORD: hmall_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    volumes:
      - hmall_minio:/data
    command: server /data --console-address ":9001"

volumes:
  hmall_pgdata:
  hmall_minio:
