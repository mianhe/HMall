server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hmall
    username: hmall
    password: hmall_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # update：启动时若表不存在则根据实体建表；表已存在则不改动。本地开发用此即可。
      # 正式环境通常改为 none，表结构用 Flyway/Liquibase 迁移管理。
      ddl-auto: update
    show-sql: false
