# 验收测试专用：使用 H2 内存库，与生产/开发 PostgreSQL 完全隔离
# 测试结束后 H2 进程内数据随之销毁，不会影响生产库
spring:
  datasource:
    url: jdbc:h2:mem:hmall_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
