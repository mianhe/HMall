server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # AI API (SSE/streaming, longer timeout)
    location /api/ai/ {
        proxy_pass http://smart-interaction-service:8089/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # BFF API - 订单创建需串行调用多下游，超时 60s
    location /api/orders {
        proxy_pass http://bff-web:8085/api/orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # BFF API（其余）
    location /api/ {
        proxy_pass http://bff-web:8085/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # MCP Server (Streamable HTTP, SSE)
    location /mcp {
        proxy_pass http://hmall-mcp:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Frontend Admin（/admin 无尾斜杠时重定向到 /admin/，否则会落到 location / 返回 web 前台）
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Frontend Web (default)
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
    }
}
