server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hmall
    username: hmall
    password: hmall_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.HashMap
      auto-offset-reset: earliest

order:
  kafka:
    topic:
      order-created: order.created
      order-cancelled: order.cancelled
      order-completed: order.completed
      payment-completed: payment.completed
      payment-failed: payment.failed
      payment-expired: payment.expired
      fulfillment-order-created: fulfillment.order.created
      fulfillment-shipped: fulfillment.shipped
      fulfillment-delivered: fulfillment.delivered

catalog:
  base-url: http://localhost:8080

user:
  base-url: http://localhost:8082

inventory:
  base-url: http://localhost:8083

# 配置后 Order 将真实调用 Payment 服务；不配置则使用 NoOp 桩。联调时可设为 http://localhost:8084
# payment:
#   base-url: http://localhost:8084
